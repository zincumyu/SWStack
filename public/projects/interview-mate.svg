  <text x="384" y="330" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11">I would start with a token bucket per API key, then add a</text>
  <text x="384" y="350" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11">global counter for burst protection. Each region keeps a local</text>
  <text x="384" y="370" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11">bucket and syncs deltas every second. If the service is read</text>
  <text x="384" y="390" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11">heavy, I would let the edge cache absorb repeated requests.</text>
  <text x="384" y="410" fill="#9aa2ae" font-family="Arial, Helvetica, sans-serif" font-size="10">...</text>
