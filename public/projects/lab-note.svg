  <text x="310" y="204" fill="#707c74" font-family="Arial, Helvetica, sans-serif" font-size="11">Comparing a U-Net baseline with the lab's temporal filter on night footage.</text>
  <path d="M310 226h610" stroke="#edf0ed"/>
  <text x="310" y="256" fill="#39473f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1. Setup</text>
  <text x="310" y="280" fill="#5f6b64" font-family="Arial, Helvetica, sans-serif" font-size="11">Record the camera, lens and capture settings before each run. Keep the raw frame sequence.</text>
  <rect x="310" y="300" width="610" height="104" rx="3" fill="#f8faf8" stroke="#dfe5e1"/>
  <text x="326" y="322" fill="#8b949b" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="0.8">PARAMETERS</text>
  <text x="326" y="346" fill="#4e5b53" font-family="Arial, Helvetica, sans-serif" font-size="10">camera</text>
  <text x="470" y="346" fill="#2f3a33" font-family="Arial, Helvetica, sans-serif" font-size="10">Sony A7S III / 4K 30fps</text>
  <text x="326" y="368" fill="#4e5b53" font-family="Arial, Helvetica, sans-serif" font-size="10">exposure</text>
  <text x="470" y="368" fill="#2f3a33" font-family="Arial, Helvetica, sans-serif" font-size="10">1/60s / ISO 12800</text>
  <text x="326" y="390" fill="#4e5b53" font-family="Arial, Helvetica, sans-serif" font-size="10">dataset</text>
  <text x="470" y="390" fill="#2f3a33" font-family="Arial, Helvetica, sans-serif" font-size="10">campus-night-v2 / 2.4 GB</text>
  <text x="310" y="438" fill="#39473f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">2. Run</text>
  <text x="310" y="462" fill="#5f6b64" font-family="Arial, Helvetica, sans-serif" font-size="11">Use the pinned environment snapshot. Do not install newer CUDA drivers during comparison runs.</text>
  <rect x="310" y="482" width="610" height="126" rx="3" fill="#f6f8f6" stroke="#dfe5e1"/>
  <path d="M310 508h610" stroke="#dfe5e1"/>
