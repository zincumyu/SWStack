  <text x="884" y="500" fill="#8b949b" font-family="Arial, Helvetica, sans-serif" font-size="9">copy</text>
  <text x="324" y="532" fill="#44554a" font-family="monospace" font-size="11">python train.py \</text>
  <text x="324" y="552" fill="#44554a" font-family="monospace" font-size="11">  --config configs/denoise-07.yaml \</text>
  <text x="324" y="572" fill="#44554a" font-family="monospace" font-size="11">  --seed 42 --device cuda:0</text>
  <text x="324" y="592" fill="#7c8a80" font-family="monospace" font-size="10"># output: runs/2026-10-14-denoise-07</text>
